<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAR-менеджер — FileBD (Obsidian)</title>

    <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/status.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/progress.css">
    <link rel="stylesheet" href="css/loading.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/debug.css">

    <link rel="stylesheet" href="lib/Pannellum2_5_6/pannellum.css">
    <link rel="stylesheet" href="css/panorama-viewer.css">
    <link rel="stylesheet" href="css/panorama-editor.css">
    <link rel="stylesheet" href="css/db-picker.css">
    <link rel="stylesheet" href="css/jsdos-viewer.css">
    <link rel="stylesheet" href="lib/js-dos/js-dos.css">
    <link rel="stylesheet" href="css/nes-viewer.css">
    <link rel="stylesheet" href="css/emulator-viewer.css">
    <link rel="stylesheet" href="css/gamepad-setup.css">
</head>
<body>

    <div class="toolbar">
        <button onclick="FAR.uploadFile()" id="btnUpload" disabled>📤 Загрузить</button>
        <button onclick="FAR.createFolder()" id="btnMkdir" disabled>📁 Создать папку</button>
        <button onclick="FAR.copySelected()" class="btn-success" id="btnCopy" disabled>📋 → Копировать</button>
        <button onclick="FAR.moveSelected()" class="btn-move" id="btnMove" disabled>✂️ → Перенести</button>
        <button onclick="FAR.downloadSelectedUncompressed()" class="btn-download" id="btnDownload" disabled>📥 → Скачать</button>
        <button onclick="FAR.downloadSelectedAsZip()" class="btn-zip" id="btnZip" disabled>🗜️ → Скачать ZIP</button>
        <button onclick="FAR.deleteSelected()" class="btn-danger" id="btnDelete" disabled>🗑️ Удалить</button>
        <button onclick="FAR.refreshFiles()" class="btn-warning" id="btnRefresh" disabled>🔄 Обновить</button>
        <button onclick="FAR.showDebug()" id="btnDebug" title="Показать структуру документа" disabled>🔍 Debug</button>
        <button onclick="FAR.migrateLeadingSlashes()" class="btn-migrate" id="btnMigrate" title="Исправить старые документы с ведущим слэшем" disabled>🩹 Fix paths</button>
        <button onclick="FAR.openGamepadSetup()" id="btnGamepad" title="Настроить джойстик">🎮 Джойстик</button>
        <button onclick="FAR.onAuthButton()" class="btn-auth" id="btnAuth" title="Войти / Выйти">🔐 LogIn</button>
        <span style="color:#a6adc8;font-size:12px;margin-left:auto;" id="statusText">Инициализация…</span>
    </div>

    <div class="panels">
        <div class="panel active" id="panelLeft" onclick="FAR.setActivePanel('left')">
            <div class="panel-header">
                <span class="path" id="pathLeft">/</span>
                <div class="nav-buttons">
                    <button onclick="event.stopPropagation(); FAR.navigatePanel('left', '..')">⬆</button>
                    <button onclick="event.stopPropagation(); FAR.navigatePanel('left', '/')">🏠</button>
                </div>
            </div>
            <div class="file-list" id="listLeft"></div>
            <div class="drop-hint" id="dropHintLeft">
                <div class="drop-icon">📥</div>
                <div>Отпустите, чтобы загрузить</div>
                <div class="drop-path" id="dropPathLeft">/</div>
            </div>
        </div>
        <div class="panel" id="panelRight" onclick="FAR.setActivePanel('right')">
            <div class="panel-header">
                <span class="path" id="pathRight">/</span>
                <div class="nav-buttons">
                    <button onclick="event.stopPropagation(); FAR.navigatePanel('right', '..')">⬆</button>
                    <button onclick="event.stopPropagation(); FAR.navigatePanel('right', '/')">🏠</button>
                </div>
            </div>
            <div class="file-list" id="listRight"></div>
            <div class="drop-hint" id="dropHintRight">
                <div class="drop-icon">📥</div>
                <div>Отпустите, чтобы загрузить</div>
                <div class="drop-path" id="dropPathRight">/</div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span id="statusLeft">Левая: 0</span>
        <span id="statusRight">Правая: 0</span>
        <span class="total-size" id="totalSize">💾 Всего: 0 B • файлов: 0 • папок: 0</span>
        <span class="sel-info" id="selInfo"></span>
    </div>

    <div id="modalRoot"></div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Pannellum -->
    <script src="lib/Pannellum2_5_6/pannellum.js"></script>
    <script src="lib/Pannellum2_5_6/libpannellum.js"></script>

    <!-- Основные модули -->
    <script src="js/01-config.js"></script>
    <script src="js/02-state.js"></script>
    <script src="js/03-utils.js"></script>
    <script src="js/04-crypto.js"></script>
    <script src="js/05-connection.js"></script>
    <script src="js/06-files.js"></script>
    <script src="js/07-progress.js"></script>
    <script src="js/08-panels.js"></script>
    <script src="js/09-auth.js"></script>
    <script src="js/10-connection-modal.js"></script>
    <script src="js/11-viewer.js"></script>
    <script src="js/12-debug.js"></script>
    <script src="js/13-upload.js"></script>
    <script src="js/14-mkdir.js"></script>
    <script src="js/15-copy.js"></script>
    <script src="js/16-move.js"></script>
    <script src="js/17-delete.js"></script>
    <script src="js/18-download.js"></script>
    <script src="js/19-zip.js"></script>
    <script src="js/20-migrate.js"></script>
    <script src="js/21-dragdrop.js"></script>
    <script src="js/22-keyboard.js"></script>
    <script src="js/23-main.js"></script>
    <script src="js/24-panorama-viewer.js"></script>
    <script src="js/25-panorama-db-resolver.js"></script>
    <script src="js/26-panorama-editor.js"></script>
    <script src="js/27-db-picker.js"></script>

    <!-- JS-DOS -->
    <script src="lib/js-dos/js-dos.js"></script>
    <script src="js/28-jsdos-viewer.js"></script>
    <!-- JSNES -->
    <script src="js/29-nes-viewer.js"></script>
    <!-- EmulatorJS -->
    <script src="js/30-emulator-viewer.js"></script>
    <!-- Gamepad -->
    <script src="js/31-gamepad.js"></script>
    <script src="js/32-gamepad-setup.js"></script>
</body>
</html>
